version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - local/qdrant/directory:/qdrant/storage

    
  rag:
    image: rag:latest
    ports:
      - "8080:8080" 
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
